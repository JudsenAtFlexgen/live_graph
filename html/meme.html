<html>
    <head>
        <title>Power Graph</title>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="https://unpkg.com/htmx.org@1.9.10"></script>
        <link rel="stylesheet" href="style/style.css">
    </head>
    <body>
        <h1>Generate Power Graph</h1>

        <!-- Form to take inputs -->
        <form id="inputForm" hx-post="/get_chart_data" hx-target="#chart-script" hx-swap="innerHTML">
            <label for="ratedPower">Rated Power:</label>
            <input type="number" id="ratedPower" name="ratedPower" step="any" required><br>

            <label for="socChgBegin">SOC Charge Begin (%):</label>
            <input type="number" id="socChgBegin" name="socChgBegin" step="any" required><br>

            <label for="socChgEnd">SOC Charge End (%):</label>
            <input type="number" id="socChgEnd" name="socChgEnd" step="any" required><br>

            <label for="socDischgBegin">SOC Discharge Begin (%):</label>
            <input type="number" id="socDischgBegin" name="socDischgBegin" step="any" required><br>

            <label for="socDischgEnd">SOC Discharge End (%):</label>
            <input type="number" id="socDischgEnd" name="socDischgEnd" step="any" required><br>

            <label for="socStep">SOC Precision:</label>
            <input type="number" id="socStep" name="socStep" step="any" required><br>

            <button type="submit">Generate Graph</button>
        </form>

        <!-- Container for the chart -->
        <div class="container">
            <canvas id="myChart" width="400" height="200"></canvas>
        </div>

        <!-- This div is where HTMX will swap the script -->
        <div id="chart-script" style="display:none;"></div>

        <script>
            // Initial chart setup
            const ctx = document.getElementById('myChart').getContext('2d');
            const myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Chargeable Power',
                        data: [],
                        backgroundColor: 'rgba(75, 192, 192, 0.2)',
                        borderColor: 'rgba(75, 192, 192, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    scales: {
                        y: {
                            beginAtZero: true,
                            min: -10000,
                            max: 10000
                        }
                    }
                }
            });

            // Function to update the chart with new data
            function updateChart(socValues, newData) {
                // Reset the chart labels and datasets
                myChart.data.labels = socValues;
                myChart.data.datasets = [];

                // Assuming all data arrays are the same length
                const dataLength = newData[0].data.length;

                let allData = [];

                // Process the new data and add to the chart
                newData.forEach(item => {
                    myChart.data.datasets.push({
                        label: item.label,
                        data: item.data,
                        backgroundColor: 'rgba(75, 192, 192, 0.2)',
                        borderColor: item.hex_color,
                        borderWidth: 1
                    });
                    allData = allData.concat(item.data); // Collect all data to compute min/max
                });

                const minY = Math.min(...allData) - 250;
                const maxY = Math.max(...allData) + 250;

                myChart.options.scales.y = {
                    beginAtZero: false,
                    min: minY,
                    max: maxY
                };

                // Update the chart to display the new data
                myChart.update();
            }
        </script>
    </body>
</html>
